<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C2 Model Live</title>
<style>
:root{--bg:#EEF3F2;--card:#FBFDFD;--ink:#0E2A31;--soft:#4A646C;--line:#C4D3D1;--tide:#14677A;--tide2:#0C4A59;--ok:#2F8F6B;--okw:#D6EBE2;--bad:#B63552;--badw:#F2D3DA;--warn:#C39319;--warnw:#F3E6C0;--neu:#DCE6E4;--eff:#F6DCCB;--font:'Segoe UI',system-ui,-apple-system,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0A1A1F;--card:#10262C;--ink:#E4EEEC;--soft:#9DB6B8;--line:#234149;--tide:#4FB3C4;--tide2:#8DD3DF;--ok:#4FBF93;--okw:#123A2E;--bad:#E5718A;--badw:#451A26;--warn:#E0B23D;--warnw:#3B3011;--neu:#173139;--eff:#40240F}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;padding:18px 16px 40px}
.wrap{max-width:1100px;margin:0 auto}
h1{font-size:20px;margin:0 0 14px;font-weight:650}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:var(--card);border:0;border-right:1px solid var(--line);padding:9px 14px;cursor:pointer;color:var(--ink);font:inherit}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--tide);color:#fff;font-weight:600}
select,.btn{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:38px}
.btn{cursor:pointer;font-weight:600}
.btn.p{background:var(--tide);border-color:var(--tide);color:#fff}
.lbl{font-size:12.5px;color:var(--soft)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.big{font-family:var(--mono);font-size:56px;line-height:1;font-weight:500}
.chip{display:inline-block;border-radius:99px;padding:3px 12px;font-weight:600;font-size:13.5px}
.chip.ok{background:var(--okw);color:var(--ok)}.chip.bad{background:var(--badw);color:var(--bad)}.chip.neu{background:var(--neu);color:var(--soft)}.chip.warn{background:var(--warnw);color:var(--warn)}
.meter{height:12px;border-radius:9px;background:var(--neu);overflow:hidden;position:relative;margin:12px 0}
.meter i{display:block;height:100%;background:var(--tide);transition:width .25s}
.meter b{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--ink);opacity:.6}
.row{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.stat{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-family:var(--mono);font-size:22px;font-weight:500}
.stat span{font-size:12px;color:var(--soft)}
svg{display:block;width:100%;height:auto}
.sig{display:grid;grid-template-columns:minmax(0,1.1fr) 62px minmax(0,1fr);gap:8px;align-items:center;margin:7px 0;font-size:13px}
.sig .tr{height:8px;background:var(--neu);border-radius:5px;position:relative}
.sig .tr i{position:absolute;top:0;height:8px;border-radius:5px;background:var(--tide)}
.sig .tr u{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--soft);opacity:.7}
.mono{font-family:var(--mono)}
.foot{margin-top:12px;font-size:12.5px;color:var(--soft)}
</style>
</head>
<body>
<div class="wrap">
  <h1>C2 trained model, live</h1>
  <div class="bar">
    <div class="seg" id="mSeg" role="group" aria-label="Model">
      <button type="button" data-m="stress" aria-pressed="true">Stress</button>
      <button type="button" data-m="load" aria-pressed="false">Mental effort</button>
    </div>
    <label class="lbl" for="pSel">New person</label><select id="pSel"></select>
    <span id="hWrap" class="row" hidden><label class="lbl" for="hSel">History the model has</label>
      <select id="hSel"><option value="none">None (day 1)</option><option value="10">10 windows</option><option value="full">Full</option></select></span>
    <span class="row" style="margin-left:auto">
      <button class="btn p" id="play" type="button">Play</button>
      <button class="btn" id="step" type="button">Next</button>
      <button class="btn" id="restart" type="button">Restart</button>
      <label class="lbl" for="spd">Speed</label>
      <select id="spd"><option value="1">1x</option><option value="2">2x</option><option value="4" selected>4x</option><option value="8">8x</option></select>
    </span>
  </div>
  <div class="grid">
    <div class="card"><svg id="chart" viewBox="0 0 900 470" role="img" aria-label="Model output over time"></svg></div>
    <div class="card" aria-live="polite">
      <div class="lbl" id="rdLbl"></div>
      <div class="big" id="pct">0%</div>
      <div class="meter"><i id="mt" style="width:0"></i><b></b></div>
      <div class="row"><span class="chip neu" id="says"></span><span class="chip neu" id="verdict"></span></div>
      <div class="lbl" style="margin-top:8px">Truth: <b id="truth" style="color:var(--ink)"></b></div>
      <div class="stats">
        <div class="stat"><b id="sSeen">0</b><span>windows seen</span></div>
        <div class="stat"><b id="sAcc">-</b><span>correct so far</span></div>
        <div class="stat"><b id="sFp">0</b><span>false alarms</span></div>
        <div class="stat"><b id="sFn">0</b><span>missed</span></div>
      </div>
      <div style="margin-top:14px" id="sigs"></div>
    </div>
  </div>
  <p class="foot" id="foot"></p>
</div>

(function(){
'use strict';
var $=function(i){return document.getElementById(i)};
var NAMES=['Heart rate','Heart rate swing','HRV RMSSD','HRV SDNN','HRV pNN50'];
var S={m:'stress',p:null,i:0,playing:false,t:null,P:[],seq:[]};
function M(){return MODELS[S.m]}
function score(x){var m=M(),lg=m.intercept;for(var k=0;k<x.length;k++){lg+=m.coef[k]*(x[k]-m.mean[k])/m.scale[k]}return 1/(1+Math.exp(-lg))}
function qtl(v,t){v=v.slice().sort(function(a,b){return a-b});var i=(v.length-1)*t,lo=Math.floor(i),hi=Math.ceil(i);return v[lo]+(v[hi]-v[lo])*(i-lo)}

function build(){
  var m=M(),order=m.meta.acts.map(function(a){return a[0]});
  var all=m.windows.filter(function(w){return w.p===S.p});
  S.seq=all.slice().sort(function(a,b){return S.m==='stress'?(a.t-b.t):((order.indexOf(a.cond)-order.indexOf(b.cond))||(a.t-b.t))});
  var mode=$('hSel').value;
  S.P=S.seq.map(function(w){
    if(m.meta.input==='raw')return score(w.raw);
    if(mode==='full')return score(w.z);
    var med=m.pop.med.slice(),sp=m.pop.iqr.slice();
    if(mode==='10'){var base=all.filter(function(x){return x.o<10});
      for(var f=0;f<5;f++){var v=base.map(function(x){return x.raw[f]});med[f]=qtl(v,.5);sp[f]=Math.max(qtl(v,.75)-qtl(v,.25),1e-6)}}
    return score(w.raw.map(function(x,f){return (x-med[f])/sp[f]}));
  });
}
function label(cond){var a=M().meta.acts.filter(function(x){return x[0]===cond})[0];return a?a[1]:cond}
function colorOf(cond){return cond==='Baseline'?'var(--neu)':(cond==='Stress'||M().meta.input==='z')?'var(--eff)':(cond==='Amusement'?'var(--warnw)':'var(--okw)')}
function chart(){
  var n=S.seq.length,W=900,H=470,L=44,R=12,T=14,B=44,pw=W-L-R,ph=H-T-B;
  function X(i){return L+(n<2?0:i/(n-1))*pw}function Y(p){return T+(1-p)*ph}
  var s='';
  var a=0;
  while(a<n){var b=a;while(b+1<n&&S.seq[b+1].cond===S.seq[a].cond)b++;
    var x0=a===0?L:(X(a-1)+X(a))/2,x1=b===n-1?L+pw:(X(b)+X(b+1))/2;
    s+='<rect x="'+x0+'" y="'+T+'" width="'+(x1-x0)+'" height="'+ph+'" fill="'+colorOf(S.seq[a].cond)+'" opacity=".85"/>';
    s+='<text x="'+((x0+x1)/2)+'" y="'+(H-B+16)+'" text-anchor="middle" font-size="11" fill="var(--soft)">'+label(S.seq[a].cond)+'</text>';
    a=b+1}
  [0,.25,.5,.75,1].forEach(function(p){s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(p)+'" y2="'+Y(p)+'" stroke="var(--line)" stroke-width="'+(p===.5?1.6:.6)+'" '+(p===.5?'stroke-dasharray="5 4"':'')+'/><text x="'+(L-6)+'" y="'+(Y(p)+4)+'" text-anchor="end" font-size="11" fill="var(--soft)">'+Math.round(p*100)+'%</text>'});
  var pts=[];for(var i=0;i<=S.i&&i<n;i++)pts.push(X(i).toFixed(1)+','+Y(S.P[i]).toFixed(1));
  if(pts.length>1)s+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--tide2)" stroke-width="2"/>';
  for(var j=0;j<=S.i&&j<n;j++){var ok=(S.P[j]>=.5)===(S.seq[j].y===1);s+='<circle cx="'+X(j)+'" cy="'+Y(S.P[j])+'" r="'+(j===S.i?5.5:3)+'" fill="'+(ok?'var(--ok)':'var(--bad)')+'" '+(j===S.i?'stroke="var(--ink)" stroke-width="1.5"':'')+'/>'}
  s+='<text x="'+(L+4)+'" y="'+(T+12)+'" font-size="11" fill="var(--soft)">Model output: probability of '+M().meta.pos+'. Green = right, rose = wrong</text>';

}
function readout(){

  $('pct').textContent=Math.round(100*p)+'%';$('mt').style.width=(100*p)+'%';
  var sa=$('says');sa.className='chip '+(eff?'warn':'neu');sa.textContent=eff?(M().meta.pos+' likely'):('no '+M().meta.pos);
  var v=$('verdict');v.className='chip '+(ok?'ok':'bad');v.textContent=ok?'right':'wrong';
  $('truth').textContent=truth?label(w.cond):label(w.cond);
  var seen=i+1,right=0,fp=0,fn=0;
  for(var k=0;k<=i;k++){var pr=S.P[k]>=.5,tr=S.seq[k].y===1;if(pr===tr)right++;else if(pr)fp++;else fn++}
  $('sSeen').textContent=seen;$('sAcc').textContent=Math.round(100*right/seen)+'%';$('sFp').textContent=fp;$('sFn').textContent=fn;
  var h='';for(var f=0;f<5;f++){var z=Math.max(-3,Math.min(3,w.z[f])),wd=Math.abs(z)/3*50;
    h+='<div class="sig"><span>'+NAMES[f]+'</span><span class="mono" style="text-align:right">'+w.raw[f]+'</span><div class="tr"><u></u><i style="'+(z>=0?'left:50%':'right:50%')+';width:'+wd+'%"></i></div></div>'}
  $('sigs').innerHTML='<div class="lbl" style="margin-bottom:4px">Heart signals in this window (bar: vs this person\'s own usual)</div>'+h;
}
function render(){chart();readout()}

function tick(){if(S.i<S.seq.length-1){S.i++;render()}if(S.i>=S.seq.length-1)stop()}
function play(){
  if(S.playing){stop();return}

}
function setup(){
  stop();var m=M();
  var ppl=people();if(ppl.indexOf(S.p)<0)S.p=ppl[0];
  $('pSel').innerHTML=ppl.map(function(p){return '<option value="'+p+'">Person '+p+'</option>'}).join('');$('pSel').value=S.p;

  $('foot').textContent='Trained on '+m.train.people+' people. These '+H.people+' people were never in training. On all of their windows: AUC '+H.auc.toFixed(2)+', balanced accuracy '+H.bacc.toFixed(2)+'.';
  S.i=0;build();render();$('play').textContent='Play';
}
$('mSeg').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;S.m=b.dataset.m;S.p=null;setup()});

$('play').addEventListener('click',play);
$('step').addEventListener('click',function(){stop();if(S.i<S.seq.length-1){S.i++}render()});

$('spd').addEventListener('change',function(){if(S.playing){clearInterval(S.t);S.t=setInterval(tick,700/ +this.value)}});

})();
